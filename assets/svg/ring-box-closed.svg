<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <!-- Subtle Velvet Noise/Gradient Defs -->
  <defs>
    <linearGradient id="plumVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282D52" />
      <stop offset="60%" stop-color="#1E2340" />
      <stop offset="100%" stop-color="#14172B" />
    </linearGradient>
    <linearGradient id="roseGoldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87B7B" />
      <stop offset="50%" stop-color="#E5ABAB" />
      <stop offset="100%" stop-color="#B87B7B" />
    </linearGradient>
  </defs>

  <!-- #base: Velvet Box Bottom Half -->
  <g id="base">
    <!-- Bottom Rim & Sides -->
    <path d="M30 92 L35 150 Q36 158 45 160 L155 160 Q164 158 165 150 L170 92 Z" fill="url(#plumVelvet)" stroke="#C98B8B" stroke-width="1.2"/>
    <!-- Bottom Bevel Edge -->
    <path d="M42 154 L158 154" stroke="url(#roseGoldLine)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- #lid: Velvet Box Top Half (Hinged at Back) -->
  <g id="lid">
    <!-- Lid Shell -->
    <path d="M26 92 L32 36 Q34 26 44 24 L156 24 Q166 26 168 36 L174 92 Z" fill="url(#plumVelvet)" stroke="#C98B8B" stroke-width="1.2"/>
    <!-- Rose Gold Trim Line along Lid Rim -->
    <path d="M26 92 L174 92" stroke="url(#roseGoldLine)" stroke-width="1.6"/>
    <!-- Upper Lid Bevel Line -->
    <path d="M38 34 L162 34" stroke="url(#roseGoldLine)" stroke-width="0.9" opacity="0.45"/>
    
    <!-- Rose Gold Clasp in Center -->
    <g id="clasp" transform="translate(100, 92)">
      <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#E5ABAB" stroke="#C98B8B" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.6" fill="#1E2340"/>
    </g>
  </g>
</svg>
