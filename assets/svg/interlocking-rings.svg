<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldFoilRings" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6A2E" />
      <stop offset="30%" stop-color="#E9D08F" />
      <stop offset="55%" stop-color="#B8923F" />
      <stop offset="75%" stop-color="#F3E2AE" />
      <stop offset="100%" stop-color="#9A7632" />
    </linearGradient>
  </defs>

  <!-- Left Ring -->
  <circle cx="52" cy="35" r="26" stroke="url(#goldFoilRings)" stroke-width="1.4" />
  <circle cx="52" cy="35" r="24.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4" />

  <!-- Right Ring with Solitaire Diamond -->
  <circle cx="88" cy="35" r="26" stroke="url(#goldFoilRings)" stroke-width="1.4" />
  <circle cx="88" cy="35" r="24.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4" />

  <!-- Solitaire Diamond on Right Ring -->
  <g transform="translate(88, 9)">
    <polygon points="0,-7 6,-2 4,3 -4,3 -6,-2" fill="#FAF6EF" stroke="url(#goldFoilRings)" stroke-width="0.9" />
    <line x1="0" y1="-7" x2="0" y2="3" stroke="url(#goldFoilRings)" stroke-width="0.6" />
    <!-- 4-point sparkle -->
    <path d="M0,-12 L1,-8 L4,-7 L1,-6 L0,-2 L-1,-6 L-4,-7 L-1,-8 Z" fill="#F3E2AE" />
  </g>
</svg>