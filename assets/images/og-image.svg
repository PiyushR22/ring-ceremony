<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="ogGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6A2E" />
      <stop offset="30%" stop-color="#E9D08F" />
      <stop offset="55%" stop-color="#B8923F" />
      <stop offset="75%" stop-color="#F3E2AE" />
      <stop offset="100%" stop-color="#9A7632" />
    </linearGradient>
    <radialGradient id="ogBordeauxBloom" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4A1521" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#161214" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C0A0B" />
    </radialGradient>
  </defs>

  <!-- Deep Noir Background -->
  <rect width="100%" height="100%" fill="#0C0A0B"/>
  <rect width="100%" height="100%" fill="url(#ogBordeauxBloom)"/>

  <!-- Thin Gold Foil Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="url(#ogGoldFoil)" stroke-width="1.5" opacity="0.45"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="url(#ogGoldFoil)" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- Monogram Circle in Center -->
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="48" fill="#161214" stroke="url(#ogGoldFoil)" stroke-width="1.4"/>
    <text x="0" y="11" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="32" font-weight="600" fill="url(#ogGoldFoil)" text-anchor="middle" letter-spacing="2">S &amp; V</text>
  </g>

  <!-- Title & Couple Names -->
  <text x="600" y="275" font-family="'Jost', sans-serif" font-size="16" fill="#A89F94" text-anchor="middle" letter-spacing="8">THE RING CEREMONY OF</text>
  <text x="600" y="375" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#F4EDE2" text-anchor="middle">Shailja &amp; Vikas</text>
  <text x="600" y="435" font-family="'Jost', sans-serif" font-size="17" fill="url(#ogGoldFoil)" text-anchor="middle" letter-spacing="10">SATURDAY, 5 DECEMBER 2026</text>

  <!-- Venue & Hosting Line -->
  <text x="600" y="500" font-family="'Bodoni Moda', Georgia, serif" font-size="22" fill="#D2C8BC" text-anchor="middle" font-style="italic">Hotel Samdareeya Inn • Jabalpur, Madhya Pradesh</text>
  <text x="600" y="535" font-family="'Jost', sans-serif" font-size="14" fill="#8C847B" text-anchor="middle" letter-spacing="4">WITH LOVE, RAJAK FAMILY</text>
</svg>